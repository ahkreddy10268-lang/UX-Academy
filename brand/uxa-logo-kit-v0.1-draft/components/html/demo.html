<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UX-Academy logo — component demo (draft v0.1)</title>
<link rel="icon" href="../../icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../icons/favicon.ico" sizes="any">
<script src="uxa-logo.js" defer></script>
<style>
  body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#000;background:#fff}
  section{padding:48px 24px;display:flex;gap:48px;align-items:center;flex-wrap:wrap}
  .dark{background:#0A0A0A;color:#fff}
  h2{width:100%;margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#6B6B6B}
</style>
</head>
<body>
<section><h2>On light</h2>
  <uxa-logo variant="full" width="320"></uxa-logo>
  <uxa-logo variant="symbol" width="200"></uxa-logo>
  <uxa-logo variant="symbol" treatment="flat" width="200"></uxa-logo>
  <uxa-logo variant="wordmark" width="280"></uxa-logo>
  <uxa-logo variant="symbol" width="64"></uxa-logo>
  <uxa-logo variant="symbol" width="32"></uxa-logo>
</section>
<section class="dark"><h2>On dark</h2>
  <uxa-logo variant="full" tone="on-dark" width="320"></uxa-logo>
  <uxa-logo variant="symbol" tone="on-dark" width="200"></uxa-logo>
  <uxa-logo variant="symbol" tone="on-dark" treatment="flat" width="200"></uxa-logo>
  <uxa-logo variant="wordmark" tone="on-dark" width="280"></uxa-logo>
  <uxa-logo variant="symbol" tone="on-dark" width="64"></uxa-logo>
  <uxa-logo variant="symbol" tone="on-dark" width="32"></uxa-logo>
</section>
</body>
</html>
