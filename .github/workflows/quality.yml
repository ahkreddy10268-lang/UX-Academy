name: GitHub quality checks

on:
  push:
    branches:
      - claude/merge-all-20261124
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Content, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run content, type, test and lint checks
        run: npm run check

      - name: Validate taxonomy
        run: npm run test:taxonomy

      - name: Regenerate project documentation
        run: npm run docs:generate

      - name: Confirm generated records are current
        run: git diff --exit-code

      - name: Build production bundle (no deployment)
        run: npm run build
